<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Canvas Store</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #2874f0;
      color: white;
      padding: 16px 6%;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #2874f0;
    }

    .payment-option {
      border: 2px solid #2874f0;
      border-radius: 7px;
      padding: 16px;
      background: #f5f9ff;
      font-weight: bold;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      padding-top: 18px;
    }

    .pay-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 6px;
      background: #ff9f00;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-btn:hover {
      background: #fb8c00;
    }

    .support {
      text-align: center;
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }

    .success {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .success-box {
      background: white;
      width: 90%;
      max-width: 430px;
      padding: 35px;
      border-radius: 10px;
      text-align: center;
    }

    .success-box h2 {
      color: #168a35;
      margin-bottom: 12px;
    }

    .success-box button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 5px;
      background: #2874f0;
      color: white;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
    }

    @media(max-width: 800px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  Canvas Store
</header>

<div class="container">

  <div id="emptyCart" class="box empty" style="display:none;">
    <h2>Your cart is empty</h2>
    <button onclick="window.location.href='index.html'">
      Continue Shopping
    </button>
  </div>

  <div id="checkoutContent" class="checkout-grid">

    <!-- CUSTOMER DETAILS -->
    <div>

      <div class="box">
        <h2>Delivery Details</h2>

        <label>Full Name</label>
        <input id="customerName" type="text" placeholder="Enter your full name">

        <label>Mobile Number</label>
        <input id="mobile" type="tel" maxlength="10" placeholder="Enter 10 digit mobile number">

        <label>Full Address</label>
        <textarea id="address" placeholder="House No., Street, Area"></textarea>

        <label>City</label>
        <input id="city" type="text" placeholder="Enter city">

        <label>Pincode</label>
        <input id="pincode" type="text" maxlength="6" placeholder="Enter pincode">
      </div>

      <!-- PAYMENT -->
      <div class="box">
        <h2>Payment Method</h2>

        <div class="payment-option">
          💳 Online Payment
          <br>
          <small style="font-weight:normal;">
            Pay securely online
          </small>
        </div>
      </div>

    </div>

    <!-- ORDER SUMMARY -->
    <div>

      <div class="box">
        <h2>Order Summary</h2>

        <div id="orderItems"></div>

        <div class="summary-item">
          <span>Subtotal</span>
          <strong id="subtotal">₹0</strong>
        </div>

        <div class="summary-item">
          <span>Delivery Charge</span>
          <strong id="delivery">₹0</strong>
        </div>

        <div class="summary-total">
          <span>Total</span>
          <span id="total">₹0</span>
        </div>

        <button class="pay-btn" onclick="placeOrder()">
          Pay Now
        </button>

        <div class="support">
          Need help?<br>
          Customer Support: <strong>7042827070</strong>
        </div>

      </div>

    </div>

  </div>
</div>

<!-- SUCCESS -->
<div class="success" id="successBox">
  <div class="success-box">
    <h2>Order Placed Successfully 🎉</h2>
    <p>Your order has been received.</p>
    <p style="margin-top:8px;">
      Payment status: Online Payment
    </p>

    <button onclick="window.location.href='index.html'">
      Continue Shopping
    </button>
  </div>
</div>

<script>

const SUPABASE_URL = "https://prywmsmpnyvoskmnkckm.supabase.co";
const SUPABASE_KEY = "sb_publishable_QWiT8eswERtvNgrHAxQZFw_SB8aHgMg";

const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


// GET CART
let cart = JSON.parse(localStorage.getItem("cart") || "[]");


// SUPPORT DIFFERENT CART FORMATS
function getProduct(item) {
  return item.product || item;
}

function getQuantity(item) {
  return Number(item.quantity || item.qty || 1);
}


// CHECK EMPTY
if (!cart.length) {
  document.getElementById("checkoutContent").style.display = "none";
  document.getElementById("emptyCart").style.display = "block";
}


// CALCULATE TOTAL
let subtotal = 0;

cart.forEach(item => {

  const product = getProduct(item);
  const qty = getQuantity(item);

  const price = Number(product.price || 0);

  subtotal += price * qty;

});


const deliveryCharge = 0;
const total = subtotal + deliveryCharge;


// SHOW ITEMS
const orderItems = document.getElementById("orderItems");

cart.forEach(item => {

  const product = getProduct(item);
  const qty = getQuantity(item);

  const price = Number(product.price || 0);

  const div = document.createElement("div");

  div.className = "summary-item";

  div.innerHTML = `
    <span>
      ${product.name || "Product"} × ${qty}
    </span>
    <strong>
      ₹${(price * qty).toLocaleString("en-IN")}
    </strong>
  `;

  orderItems.appendChild(div);

});


document.getElementById("subtotal").textContent =
  "₹" + subtotal.toLocaleString("en-IN");

document.getElementById("delivery").textContent =
  "₹" + deliveryCharge.toLocaleString("en-IN");

document.getElementById("total").textContent =
  "₹" + total.toLocaleString("en-IN");


// PLACE ORDER
async function placeOrder() {

  const name =
    document.getElementById("customerName").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const city =
    document.getElementById("city").value.trim();

  const pincode =
    document.getElementById("pincode").value.trim();


  if (!name) {
    alert("Please enter your name.");
    return;
  }

  if (!/^[0-9]{10}$/.test(mobile)) {
    alert("Please enter a valid 10 digit mobile number.");
    return;
  }

  if (!address) {
    alert("Please enter your full address.");
    return;
  }

  if (!city) {
    alert("Please enter your city.");
    return;
  }

  if (!/^[0-9]{6}$/.test(pincode)) {
    alert("Please enter a valid 6 digit pincode.");
    return;
  }


  const orderData = {

    customer_name: name,

    mobile: mobile,

    address: address,

    city: city,

    pincode: pincode,

    payment_method: "Online Payment",

    items: cart,

    subtotal: subtotal,

    delivery_charge: deliveryCharge,

    total: total,

    status: "Pending"

  };


  const button = document.querySelector(".pay-btn");

  button.disabled = true;

  button.textContent = "Processing...";


  const { data, error } =
    await supabaseClient
      .from("orders")
      .insert([orderData])
      .select();


  if (error) {

    console.error(error);

    alert(
      "Order save nahi hua.\n\n" +
      error.message
    );

    button.disabled = false;

    button.textContent = "Pay Now";

    return;
  }


  // CLEAR CART
  localStorage.removeItem("cart");


  // SUCCESS
  document.getElementById("successBox").style.display = "flex";

}

</script>

</body>
</html>
